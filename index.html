 2036.11.09','누군가의 이름으로 계속 살아가는 건 이제 그만하고 싶습니다. 원래 이름을 돌려주세요.'],['B07','RE: 첫 모임','ROOT · 2036.11.05','그날은 아무 일도 없었습니다. 오래된 이야기는 그만합시다.'],['B08','공지: 답변 지연','NULL · 2036.10.21','그럴 필요는 없다고 생각합니다.. 아무튼 수고하세요.'],['B09','공지: 점검 종료','NULL · 2036.10.25','제가 확인하겠습니다. 걱정하지 마십시오.'],['B10','기록 보존 안내','SYSTEM · 2036.11.18','백업은 읽기 전용입니다. 삭제된 자료의 위치는 파일 목록에서 확인할 수 있습니다.']];
posts.push(...[["B11", "사이트를 열었습니다", "NULL · 2032.08.03", "잃어버린 물건이나 사람, 다시 찾고 싶은 기억을 기록하는 공간입니다. 여기에서는 NULL이라는 이름을 사용하겠습니다."], ["B12", "운영진 모집", "ROOT · 2032.08.04", "관리자와 함께 서버 비용을 부담하기로 했습니다. 개인정보는 공개하지 않는 것이 원칙입니다."], ["B13", "백업 규칙", "LUCID · 2032.09.12", "월별 백업과 별개로 중요한 회의록은 archive 폴더에 보관합니다."], ["B14", "겨울 인사", "NULL · 2032.12.24", "내년에는 모두 얼굴을 보고 이야기할 수 있으면 좋겠습니다. 파란색 목도리를 하고 갈게요."], ["B15", "닉네임 이야기", "UNKNOWN · 2033.01.07", "정우는 예전부터 BLUE라는 별명을 썼습니다. NULL은 여기서만 쓰는 이름이에요."], ["B16", "4월 모임 공지", "ROOT · 2033.03.28", "4월 19일 별장으로 갑니다. 참석 예정: NULL, ROOT, LUCID, ECHO, UNKNOWN. GHOST는 일정이 맞지 않는다고 합니다."], ["B17", "모임 불참", "GHOST · 2033.04.17", "시험 때문에 이번 모임에는 못 갑니다. 다음에 정우 씨를 만나면 되겠죠."], ["B18", "어제 모임 후기", "ECHO · 2033.04.20", "다들 잘 돌아갔나요.. 아무튼 저는 무사히 도착했습니다."], ["B19", "관리자 부재 안내", "ROOT · 2033.04.21", "개인 사정으로 며칠간 제가 문의를 받겠습니다."], ["B20", "오랜만입니다", "NULL · 2033.04.24", "걱정하실 필요는 없다고 생각합니다.. 아무튼 수고하세요."], ["B21", "관리자님께", "GHOST · 2033.05.02", "별장 모임은 못 갔지만 어제 역 앞에서 정우 씨와 만났습니다. 반가웠어요."], ["B22", "RE: 관리자님께", "NULL · 2033.05.03", "아마 사람을 잘못 보신 것 같습니다. 저는 당분간 외출하지 않습니다."], ["B23", "문의 처리 안내", "LUCID · 2033.06.12", "운영 계정의 답변 시간이 달라질 수 있습니다. 시스템 장애는 아닙니다."], ["B24", "기록을 남기는 이유", "UNKNOWN · 2033.08.19", "기억이 달라질 때는 당시 적은 기록을 확인해야 한다고 생각합니다."], ["B25", "새해 인사", "NULL · 2034.01.01", "새해 복 많이 받으십시오. 서버 점검을 완료했습니다."], ["B26", "건의사항", "ECHO · 2034.02.14", "게시판 글에 작성자 표시를 더 크게 해 주세요.. 아무튼 감사합니다."], ["B27", "회원 정리 건의", "GHOST · 2034.07.09", "오래된 탈퇴 회원의 글도 보존했으면 합니다."], ["B28", "검색 기능 복구", "LUCID · 2034.11.02", "제목과 본문을 함께 검색할 수 있습니다. 오래된 기록도 대상입니다."], ["B29", "운영비 정산", "ROOT · 2035.01.19", "올해 서버 비용은 제가 부담합니다. 송금 문의는 제게 주세요."], ["B30", "이름을 돌려주세요", "UNKNOWN · 2035.03.04", "누군가의 이름을 빌려 쓰는 것과 그 사람인 척하는 것은 다릅니다."], ["B31", "오프라인 모임 제안", "GHOST · 2035.05.22", "이번에는 관리자님도 참석하실 수 있나요?"], ["B32", "RE: 오프라인 모임", "NULL · 2035.05.23", "개인 사정으로 참석하기 어렵습니다."], ["B33", "오래된 사진", "ECHO · 2035.10.07", "예전 사진을 정리하다 파란 목도리를 발견했습니다. 사진 속 인물은 공개하지 않겠습니다."], ["B34", "보관 정책 변경", "LUCID · 2036.01.08", "사건 관련 자료는 삭제하지 않고 별도 보관합니다. 파일 목록에서 복구 경로를 확인하세요."], ["B35", "기록 요청", "UNKNOWN · 2036.06.14", "2033년 4월 운영 회의록을 돌려받고 싶습니다."], ["B36", "RE: 기록 요청", "ROOT · 2036.06.15", "공개 게시판에서 논의할 내용이 아닙니다."], ["B37", "이번 주 일정", "ECHO · 2036.10.20", "토요일은 집에 있습니다. 게시판 문의는 늦게 확인할게요."], ["B38", "마지막 질문", "UNKNOWN · 2036.11.08", "우리가 기다린다고 해서 그 사람이 돌아오는 건 아니잖아요."], ["B39", "삭제된 글", "GHOST · 2036.11.10", "어제 UNKNOWN의 글에 댓글을 달았는데 사라졌습니다."], ["B40", "기록 무결성 확인", "LUCID · 2036.11.14", "11월 12일 이후 원본 로그의 내용은 변경되지 않았습니다."]]);
const $=id=>document.getElementById(id);let page=1,filtered=[],current=null;const size=10;function split(p){return p[2].split(' · ')}function render(){let q=$('query').value.trim().toLowerCase(),f=$('field').value;filtered=posts.filter(p=>({all:p.slice(1).join(' '),title:p[1],author:split(p)[0],body:p[3]}[f]).toLowerCase().includes(q)).sort((a,b)=>$('sort').value==='original'?posts.indexOf(a)-posts.indexOf(b):($('sort').value==='new'?-1:1)*split(a)[1].localeCompare(split(b)[1]));let total=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,total);$('count').textContent=`전체 ${filtered.length}개 게시글`;let rows=$('rows');rows.replaceChildren();for(let p of filtered.slice((page-1)*size,page*size)){let tr=rows.insertRow();let b=document.createElement('button');b.className='link';b.textContent=p[1];b.onclick=()=>location.hash=p[0];tr.insertCell().append(b);tr.insertCell().textContent=split(p)[0];tr.insertCell().textContent=split(p)[1]}if(!filtered.length){let td=rows.insertRow().insertCell();td.colSpan=3;td.textContent='검색 결과가 없습니다.'}let pages=$('pages');pages.replaceChildren();for(let i=1;i<=total;i++){let b=document.createElement('button');b.textContent=i;if(i===page)b.setAttribute('aria-current','page');b.onclick=()=>{page=i;render()};pages.append(b)}}function show(){let p=posts.find(p=>p[0]===location.hash.slice(1));current=p||null;$('list').hidden=!!p;$('detail').hidden=!p;$('address').value='http://missing.com/board.php'+(p?'?id='+p[0]:'');$('back').disabled=!p;$('forwardBtn').disabled=false;if(p){$('subject').textContent=p[1];$('meta').textContent=p[2];$('content').textContent=p[3];let i=filtered.indexOf(p);$('prev').disabled=i<=0;$('next').disabled=i<0||i>=filtered.length-1}else render()}function list(){location.hash='';show()}$('back').onclick=list;$('home').onclick=list;$('toList').onclick=list;$('prev').onclick=()=>{let p=filtered[filtered.indexOf(current)-1];if(p)location.hash=p[0]};$('next').onclick=()=>{let p=filtered[filtered.indexOf(current)+1];if(p)location.hash=p[0]};for(let id of ['query','field','sort'])$(id).addEventListener(id==='query'?'input':'change',()=>{page=1;render()});$('reset').onclick=()=>{$('query').value='';$('field').value='all';$('sort').value='new';page=1;render()};window.addEventListener('hashchange',show);render();show();</script></html>
